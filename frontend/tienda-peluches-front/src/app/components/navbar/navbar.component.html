<nav class="navbar">
  <div class="logo">
    <a routerLink="/" class="logo-link">
      <img src="/imagenes/logo.png" alt="Logo Tienda Peluches" class="logo-img">
      <span>Moonsoft</span>
    </a>
  </div>

  <ul class="nav-links">
    <li>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
    </li>

    <li>
      <a routerLink="/productos" routerLinkActive="active">
        Productos
      </a>
    </li>

    <li>
      <a routerLink="/carrito" routerLinkActive="active">
        Carrito 🛒
      </a>
    </li>

    <ng-container *ngIf="!logueado">
      <li>
        <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
      </li>
      <li>
        <a routerLink="/registro" routerLinkActive="active">Registro</a>
      </li>
    </ng-container>

    <ng-container *ngIf="logueado">
      <li>
        <a routerLink="/perfil" routerLinkActive="active">Mi Perfil</a>
      </li>
      <li>
        <a href="#" (click)="logout()">Cerrar sesión</a>
      </li>
    </ng-container>
  </ul>
</nav>
